[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqpki"
version = "0.1.0"
description = "Post-quantum-capable X.509 certificate authority and PKI layer (teaching implementation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # X.509 signing with ML-DSA keys landed in 49; 50 added ML-DSA to the
    # default path-validation policy. Both are required.
    "cryptography>=50",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pqpki-demo = "pqpki.cli:main"

[tool.setuptools.packages.find]
include = ["pqpki*"]

[tool.pytest.ini_options]
# No `testpaths`, deliberately. This is the only pytest config in a shared
# group repository, so it governs a bare `pytest` run for every module here.
# Pinning it to ["tests"] made this module's suite the only one collected and
# silently skipped everyone else's -- no error, their tests simply stopped
# running. Letting pytest discover from the repository root means a new module
# is picked up automatically, with nobody needing to edit this file.
#
# To run just this module's suite: pytest tests
addopts = "-ra --strict-markers"
markers = [
    "interop: shells out to the openssl binary; skipped when OpenSSL 3.5+ is absent",
]
